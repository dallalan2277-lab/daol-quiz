<style>
:root {
  --bg: #eef3f1; --card: #ffffff; --ink: #17262a; --muted: #5d6f73; --line: #d4dfdc;
  --brand: #0f6e66; --brand-ink: #ffffff; --coin: #f2b705; --coin-ink: #3d2c00;
  --ok: #1e8a5a; --ok-bg: #e2f6ec; --no: #c8323f; --no-bg: #fde8ea; --soft: #e3f4ef;
  --font-display: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1a1c; --card: #172527; --ink: #e6efed; --muted: #9db0b2; --line: #2a3b3e;
    --brand: #3fb3a6; --brand-ink: #062320; --coin: #f5c537; --coin-ink: #2e2100;
    --ok: #4fd18f; --ok-bg: #133526; --no: #ff6b76; --no-bg: #3a1a1e; --soft: #173a36; color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
[hidden] { display: none !important; }
.screen { min-height: 100%; max-width: 760px; margin: 0 auto; padding: 16px 16px 28px; display: grid; align-content: start; gap: 16px; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--coin); outline-offset: 3px; }
.display { font-family: var(--font-display); font-weight: 400; }

/* 시작 */
.confetti svg { display: block; width: 100%; height: auto; }
.start-hero { display: grid; grid-template-columns: 140px 1fr; gap: 14px; align-items: center; }
.start-hero svg { width: 140px; height: 140px; display: block; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 2.6rem; line-height: 1.1; margin: 0; color: var(--brand); }
h1 em { font-style: normal; background: var(--coin); color: var(--coin-ink); padding: 0 .2em; border-radius: 10px; display: inline-block; transform: rotate(-2deg); }
.lead { margin: 6px 0 0; font-size: 1.1rem; color: var(--muted); }
.rules { list-style: none; margin: 0; padding: 16px; background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; display: grid; gap: 10px; }
.rules li { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 8px; }
.rules .e { font-size: 1.6rem; text-align: center; }
.big { font-family: var(--font-display); font-size: 1.7rem; border: 3px solid var(--ink); border-radius: 20px; padding: 16px 30px; background: var(--coin); color: var(--coin-ink); box-shadow: 0 7px 0 var(--ink); justify-self: center; transition: transform .1s, box-shadow .1s; }
.big:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--ink); }
.big.green { background: var(--brand); color: var(--brand-ink); }

/* 문제 */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dots { display: flex; gap: 8px; }
.dots i { width: 16px; height: 16px; border-radius: 99px; background: var(--line); display: block; }
.dots i.ok { background: var(--ok); }
.dots i.no { background: var(--no); }
.dots i.now { background: var(--coin); outline: 3px solid var(--coin); outline-offset: 2px; }
.count { font-family: var(--font-display); font-size: 1.3rem; color: var(--muted); }
.qcard { background: var(--card); border: 1.5px solid var(--line); border-radius: 20px; padding: 20px; display: grid; gap: 12px; }
.chip { justify-self: start; font-size: .85rem; font-weight: 700; padding: 3px 12px; border-radius: 99px; background: var(--soft); color: var(--brand); }
.chip.c { background: var(--coin); color: var(--coin-ink); }
.qtext { font-family: var(--font-display); font-size: 1.65rem; line-height: 1.35; margin: 0; text-wrap: pretty; }
.qtext b { color: var(--no); }
.opts { display: grid; gap: 10px; }
@media (min-width: 700px) { .opts { grid-template-columns: 1fr 1fr; } }
.opt { text-align: left; border: 2.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 16px; padding: 14px 16px; font-size: 1.15rem; display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; min-height: 64px; transition: border-color .15s, background .15s, transform .1s; }
.opt:active { transform: scale(.98); }
.opt .n { width: 36px; height: 36px; border-radius: 99px; display: grid; place-items: center; background: var(--soft); color: var(--brand); font-family: var(--font-display); font-size: 1.1rem; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.right .n { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--no); background: var(--no-bg); }
.opt.wrong .n { background: var(--no); color: #fff; }
.opt:disabled { cursor: default; }
.opt.dim { opacity: .55; }
.feedback { border-radius: 18px; padding: 16px; display: grid; gap: 6px; animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.feedback.ok { background: var(--ok-bg); border: 2px solid var(--ok); }
.feedback.no { background: var(--no-bg); border: 2px solid var(--no); }
.feedback .head { font-family: var(--font-display); font-size: 1.5rem; }
.feedback.ok .head { color: var(--ok); }
.feedback.no .head { color: var(--no); }
.feedback p { margin: 0; font-size: 1.05rem; }

/* 결과 */
.result { text-align: center; justify-items: center; }
.result svg { width: 150px; height: 150px; display: block; }
.score { font-family: var(--font-display); font-size: 1.4rem; margin: 0; }
.score b { font-size: 2.6rem; color: var(--brand); }
.king { font-family: var(--font-display); font-size: 1.6rem; background: var(--coin); color: var(--coin-ink); border: 3px solid var(--ink); border-radius: 16px; padding: 8px 18px; transform: rotate(-2deg); }
.ticket { background: var(--card); border: 3px dashed var(--brand); border-radius: 20px; padding: 16px 20px; display: grid; gap: 4px; width: 100%; max-width: 460px; }
.ticket .t { font-family: var(--font-display); font-size: 1.5rem; color: var(--brand); }
.ticket .s { color: var(--muted); font-size: .95rem; }
.ticket .stamp { font-variant-numeric: tabular-nums; font-size: .9rem; color: var(--muted); }
.again { font-size: .95rem; color: var(--muted); }

/* 도우미용 숫자 (꾹 누르면 초기화) */
.staff { position: fixed; right: 8px; bottom: 6px; font-size: .72rem; color: var(--muted); opacity: .7; padding: 6px; }

@media (max-width: 480px) {
  .start-hero { grid-template-columns: 100px 1fr; } .start-hero svg { width: 100px; height: 100px; }
  h1 { font-size: 2rem; } .qtext { font-size: 1.35rem; } .opt { font-size: 1.02rem; } .big { font-size: 1.4rem; padding: 14px 24px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

var QUIZ = [{"id": "A1", "group": "A", "tag": "", "q": "다올 마켓의 '다올코인'은 어떻게 받을 수 있을까요?", "options": ["매점에서 돈으로 산다", "학교생활을 성실히 해서 상점을 모은다", "친구에게 빌린다", "추첨으로 받는다"], "answer": 1, "tip": "상점을 많이 받은 반별 상위 10명이 순위에 따라 7~10코인을 받아요."}, {"id": "A2", "group": "A", "tag": "", "q": "다올 마켓 대상자는 몇 명일까요?", "options": ["반마다 3명", "반마다 5명", "반마다 10명", "전교 1등만"], "answer": 2, "tip": "20학급 × 10명 = 200명이 다올코인을 받아요."}, {"id": "A3", "group": "A", "tag": "", "q": "다음 중 상점을 받을 수 있는 행동으로 가장 알맞은 것은?", "options": ["복도에서 뛰기", "친구가 떨어뜨린 물건 주워 주기", "수업 시간에 몰래 게임하기", "급식 줄 새치기하기"], "answer": 1, "tip": "배려·성실·봉사가 상점으로 이어져요."}, {"id": "A4", "group": "A", "tag": "", "q": "축제 부스에서 줄이 길 때 가장 좋은 행동은?", "options": ["친구 자리에 끼어든다", "큰 소리로 재촉한다", "바닥 표시를 따라 차례를 기다린다", "다른 사람 바구니를 본다"], "answer": 2, "tip": "질서를 지키면 모두가 빨리, 기분 좋게 이용할 수 있어요."}, {"id": "A5", "group": "A", "tag": "", "q": "다 먹은 과자 봉지는 어떻게 버릴까요?", "options": ["아무 데나 둔다", "책상 서랍에 넣는다", "이물질을 털고 비닐류로 분리배출한다", "일반 쓰레기와 종이를 섞는다"], "answer": 2, "tip": "과자 봉지는 비닐류예요. 깨끗한 학교가 상점 받는 학교!"}, {"id": "A6", "group": "A", "tag": "", "q": "도서관에서 책을 빌린 뒤 지켜야 할 것은?", "options": ["마음에 들면 안 돌려준다", "반납 날짜까지 깨끗하게 읽고 돌려준다", "밑줄을 긋는다", "친구에게 다시 빌려준다"], "answer": 1, "tip": "함께 쓰는 물건을 아끼는 것도 학교생활의 기본이에요."}, {"id": "A7", "group": "A", "tag": "", "q": "친구가 혼자 점심을 먹고 있을 때 할 수 있는 따뜻한 행동은?", "options": ["못 본 척한다", "\"같이 먹을래?\" 하고 말을 건다", "사진을 찍는다", "다른 친구에게 흉본다"], "answer": 1, "tip": "작은 친절이 우리 반 분위기를 바꿔요."}, {"id": "A8", "group": "A", "tag": "", "q": "쉬는 시간에 복도에서 지켜야 할 안전 규칙은?", "options": ["계단 난간을 타고 내려간다", "오른쪽으로 걸어서 다닌다", "모퉁이에서 뛰어 나간다", "친구를 밀며 장난친다"], "answer": 1, "tip": "걸어서, 오른쪽으로! 다치지 않아야 축제도 즐겨요."}, {"id": "A9", "group": "A", "tag": "", "q": "다올 마켓 명예의 전당에는 무엇을 적을까요?", "options": ["상점 점수", "반 등수", "반과 이름만", "집 주소"], "answer": 2, "tip": "점수와 등수는 적지 않아요. 원하지 않는 학생은 빼 줘요."}, {"id": "A10", "group": "A", "tag": "", "q": "수업 중 모르는 것이 생겼을 때 가장 좋은 방법은?", "options": ["그냥 넘어간다", "친구 공책을 몰래 베낀다", "손을 들고 선생님께 질문한다", "엎드려 잔다"], "answer": 2, "tip": "질문하는 용기도 성실함이에요."}, {"id": "B1", "group": "B", "tag": "예산의 한정", "q": "8코인을 가진 다올이가 포카칩(3)과 빼빼로(2)를 담았어요. 남은 코인은?", "options": ["1코인", "2코인", "3코인", "5코인"], "answer": 2, "tip": "8 − 3 − 2 = 3. 쓸 수 있는 돈은 정해져 있어요. 이것이 '예산의 한정'이에요."}, {"id": "B2", "group": "B", "tag": "예산의 한정", "q": "7코인으로 살 수 **없는** 장바구니는?", "options": ["산리오 키링(7)", "키캡 딸깍이(5) + 컵라면(2)", "포켓몬 키링(6) + 빼빼로(2)", "포카칩(3) + 빼빼로(2) + 초코파이(1)"], "answer": 2, "tip": "6 + 2 = 8코인이라 7코인을 넘어요."}, {"id": "B3", "group": "B", "tag": "기회비용", "q": "9코인으로 손난로(9)를 샀어요. 대신 포켓몬 키링(6) + 포카칩(3)을 살 수도 있었어요. 이때 기회비용은?", "options": ["손난로", "포켓몬 키링과 포카칩", "9코인", "아무것도 없다"], "answer": 1, "tip": "기회비용은 무언가를 고르느라 **포기한 것 중 가장 좋은 것**이에요."}, {"id": "B4", "group": "B", "tag": "기회비용", "q": "'기회비용'의 뜻으로 알맞은 것은?", "options": ["물건을 살 때 내는 돈", "하나를 고르느라 포기한 다른 선택의 가치", "할인받은 금액", "남은 돈"], "answer": 1, "tip": "공짜 선택은 없어요. 무엇을 고르든 다른 것을 포기해요."}, {"id": "B5", "group": "B", "tag": "기회비용", "q": "축제 날 부스에 줄을 30분 섰어요. 그 시간에 할 수 있었던 다른 부스 체험은 무엇에 해당할까요?", "options": ["이익", "세금", "기회비용", "저축"], "answer": 2, "tip": "돈뿐 아니라 **시간**에도 기회비용이 있어요."}, {"id": "B6", "group": "B", "tag": "희소성", "q": "손난로는 20개뿐인데 50명이 원해요. 이런 상태를 무엇이라고 할까요?", "options": ["풍부함", "희소성", "저축", "할인"], "answer": 1, "tip": "원하는 사람보다 물건이 적으면 희소해요."}, {"id": "B7", "group": "B", "tag": "희소성", "q": "다음 중 희소성이 가장 큰 상황은?", "options": ["빼빼로 120개를 30명이 원한다", "초코파이 60개를 20명이 원한다", "귀마개 5개를 40명이 원한다", "핫팩 30개를 10명이 원한다"], "answer": 2, "tip": "원하는 사람 수에 비해 물건이 적을수록 희소성이 커요(40 ÷ 5 = 8배)."}, {"id": "B8", "group": "B", "tag": "희소성", "q": "희소성이 생기는 가장 큰 까닭은?", "options": ["물건 이름이 어려워서", "사람들이 원하는 만큼 물건이나 돈이 넉넉하지 않아서", "가게가 멀어서", "가격표가 없어서"], "answer": 1, "tip": "그래서 우리는 늘 '무엇을 고를지' 선택해야 해요."}, {"id": "B9", "group": "B", "tag": "대체재", "q": "신라면 소컵이 품절이라 까르보불닭 소컵을 대신 샀어요. 두 상품의 관계는?", "options": ["보완재", "대체재", "공공재", "사치재"], "answer": 1, "tip": "서로 **대신 쓸 수 있는** 상품을 대체재라고 해요."}, {"id": "B10", "group": "B", "tag": "대체재", "q": "포켓몬 키링의 대체재로 가장 알맞은 것은?", "options": ["핫팩", "컵라면", "짱구 정품 키링", "핸드크림"], "answer": 2, "tip": "쓰임새(가방 꾸미기)가 비슷해야 대체재예요."}, {"id": "B11", "group": "B", "tag": "보완재", "q": "함께 쓸 때 더 좋은 '보완재' 짝은?", "options": ["신라면과 육개장", "충전식 손난로와 충전 케이블", "포켓몬 키링과 짱구 키링", "초코파이와 빼빼로"], "answer": 1, "tip": "대체재는 '대신', 보완재는 '함께'!"}, {"id": "B12", "group": "B", "tag": "수요와 공급", "q": "포카칩을 원하는 학생이 60명인데 재고는 24개예요. 어떻게 될까요?", "options": ["재고가 남는다", "품절이 생겨 일부는 다른 것을 골라야 한다", "모두 2개씩 산다", "가격이 0이 된다"], "answer": 1, "tip": "수요(원하는 양)가 공급(파는 양)보다 많으면 부족이 생겨요."}, {"id": "B13", "group": "B", "tag": "수요와 공급", "q": "다올 마켓에서 '수요'에 해당하는 것은?", "options": ["학교가 사 온 상품 개수", "학생들이 사고 싶어 하는 상품 개수", "상품 가격표", "계산대 줄 길이"], "answer": 1, "tip": "수요 = 사려는 양, 공급 = 팔려는 양이에요."}, {"id": "B14", "group": "B", "tag": "합리적 선택", "q": "가장 합리적으로 장바구니를 짜는 방법은?", "options": ["가장 비싼 것부터 담는다", "친구와 똑같이 담는다", "내게 필요한 것과 만족도를 비교해 코인 안에서 고른다", "아무거나 빨리 담는다"], "answer": 2, "tip": "같은 코인으로 **가장 큰 만족**을 얻는 선택이 합리적 선택이에요."}, {"id": "B15", "group": "B", "tag": "가격", "q": "1코인이 약 1,000원어치라면, 7코인짜리 산리오 키링은 약 얼마어치일까요?", "options": ["700원", "7,000원", "70,000원", "1,700원"], "answer": 1, "tip": "코인은 실제 가격을 쉽게 셈하려고 만든 교환 단위예요."}, {"id": "C1", "group": "C", "tag": "", "q": "1순위로 고른 포켓몬 키링이 품절이에요! 작전판에 미리 적어 두면 좋은 것은?", "options": ["그냥 집에 간다", "친구 것을 빼앗는다", "대신 살 2순위 상품(예: 짱구 키링)", "다음 해에 산다"], "answer": 2, "tip": "품절에 대비해 '대신 살 것'을 정해 두는 것이 작전판이에요."}, {"id": "C2", "group": "C", "tag": "", "q": "8코인 장바구니 계획: 과자 꾸러미(6) + 빼빼로(2). 과자 꾸러미가 품절이면 가장 좋은 작전은?", "options": ["빼빼로를 4개 산다", "비슷한 값의 다른 상품(포켓몬 키링 6)이나 간식 조합으로 바꾼다", "아무것도 안 산다", "코인을 버린다"], "answer": 1, "tip": "같은 코인 안에서 비슷한 만족을 주는 대체재를 찾아요. 빼빼로는 한 사람이 3개까지만 살 수 있어요."}, {"id": "C3", "group": "C", "tag": "", "q": "작전판에 '포기하고 코인 남기기'를 고를 때 생각해야 할 점은?", "options": ["남은 코인은 다음 날 쓸 수 있다", "그날 안 쓰면 코인은 쓸모가 없다는 점", "코인이 저절로 늘어난다", "친구에게 줄 수 있다"], "answer": 1, "tip": "다올코인은 그날 마켓에서만 써요. '남기기'도 선택이지만 잘 따져 봐요."}, {"id": "C4", "group": "C", "tag": "", "q": "인기 상품의 '원하는 사람 80명 / 재고 40개'를 보고 세운 작전으로 가장 알맞은 것은?", "options": ["무조건 그 상품만 노린다", "그 상품이 안 되면 살 2순위와 3순위를 정해 둔다", "계산대에서 우긴다", "장바구니를 비운다"], "answer": 1, "tip": "경쟁이 센 상품일수록 플랜 B, 플랜 C가 중요해요."}, {"id": "C5", "group": "C", "tag": "", "q": "마켓이 끝난 뒤 '돌아보기'를 하는 가장 큰 까닭은?", "options": ["벌점을 주려고", "계획과 실제 구매를 비교해 다음엔 더 잘 고르려고", "코인을 돌려받으려고", "친구와 비교하려고"], "answer": 1, "tip": "계획 → 실행 → 돌아보기! 이것이 합리적 소비 습관이에요."}];
var TAGS = { A: '🏫 학교생활', C: '🛒 마켓 작전' };
var IDLE_MS = 90000;      // 문제 화면에서 90초 동안 아무것도 안 누르면 처음으로
var RESULT_MS = 40000;    // 결과 화면은 40초 뒤 처음으로
var KEY = 'daol-quiz-count';

var S = { list: [], i: 0, score: 0, marks: [], locked: false };
var timer = null, tick = null;
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(group, n, distinctTag) {
  var pool = shuffle(QUIZ.filter(function (q) { return q.group === group; })), out = [], seen = {};
  pool.forEach(function (q) { if (out.length < n && (!distinctTag || !seen[q.tag])) { out.push(q); seen[q.tag] = 1; } });
  pool.forEach(function (q) { if (out.length < n && out.indexOf(q) < 0) out.push(q); });
  return out;
}
function show(id) {
  ['s-start', 's-quiz', 's-result'].forEach(function (s) { document.getElementById(s).hidden = s !== id; });
  window.scrollTo(0, 0);
}

// 도우미용 숫자: 이 태블릿에서 완주한 사람 수 (브라우저에만 저장, 이름 없음)
function readCount() { try { return JSON.parse(localStorage.getItem(KEY)) || { done: 0, king: 0 }; } catch (e) { return { done: 0, king: 0 }; } }
function saveCount(c) { try { localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} }
function renderCount() { var c = readCount(); $('#staff').textContent = '이 태블릿 완주 ' + c.done + '명 · 경제왕 ' + c.king + '명'; }
(function () {
  var h = null, el = $('#staff');
  function down() { h = setTimeout(function () { if (confirm('이 태블릿의 완주 숫자를 0으로 할까요?')) { saveCount({ done: 0, king: 0 }); renderCount(); } }, 3000); }
  function up() { clearTimeout(h); }
  el.addEventListener('pointerdown', down); el.addEventListener('pointerup', up); el.addEventListener('pointerleave', up);
})();

function resetIdle(ms) {
  clearTimeout(timer);
  timer = setTimeout(goStart, ms);
}
function goStart() {
  clearTimeout(timer); clearInterval(tick);
  show('s-start');
}

function start() {
  S.list = pick('A', 1).concat(pick('B', 3, true), pick('C', 1));
  S.i = 0; S.score = 0; S.marks = [];
  show('s-quiz');
  renderQ();
}

function renderQ() {
  var q = S.list[S.i];
  S.locked = false;
  resetIdle(IDLE_MS);
  var dots = $('#dots'); dots.innerHTML = '';
  S.list.forEach(function (_, k) {
    var i = document.createElement('i');
    i.className = k < S.i ? S.marks[k] : (k === S.i ? 'now' : '');
    dots.appendChild(i);
  });
  $('#count').textContent = (S.i + 1) + ' / ' + S.list.length;
  var chip = $('#chip');
  chip.textContent = q.group === 'B' ? '💰 경제 · ' + q.tag : TAGS[q.group];
  chip.className = 'chip' + (q.group === 'C' ? ' c' : '');
  $('#qtext').innerHTML = rich(q.q);
  var opts = $('#opts'); opts.innerHTML = '';
  var order = shuffle([0, 1, 2, 3]);
  order.forEach(function (oi, k) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.dataset.oi = oi;
    b.innerHTML = '<span class="n">' + (k + 1) + '</span><span>' + rich(q.options[oi]) + '</span>';
    b.onclick = function () { answer(oi); };
    opts.appendChild(b);
  });
  $('#feedback').hidden = true; $('#nextBtn').hidden = true;
}

function answer(oi) {
  if (S.locked) return;
  S.locked = true;
  resetIdle(IDLE_MS);
  var q = S.list[S.i], ok = oi === q.answer;
  if (ok) S.score++;
  S.marks[S.i] = ok ? 'ok' : 'no';
  document.querySelectorAll('#opts .opt').forEach(function (b) {
    var k = Number(b.dataset.oi);
    b.disabled = true;
    if (k === q.answer) b.classList.add('right');
    else if (k === oi) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  var fb = $('#feedback');
  fb.className = 'feedback ' + (ok ? 'ok' : 'no');
  $('#fbHead').textContent = ok ? '⭕ 정답이에요!' : '❌ 아쉬워요! 정답은 초록색이에요';
  $('#fbTip').innerHTML = '💡 ' + rich(q.tip);
  fb.hidden = false;
  var nb = $('#nextBtn');
  nb.textContent = S.i < S.list.length - 1 ? '다음 문제 →' : '결과 보기 🎉';
  nb.hidden = false;
  nb.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function next() {
  if (!S.locked) return;
  if (S.i < S.list.length - 1) { S.i++; renderQ(); }
  else finish();
}

function finish() {
  var king = S.score >= 4;
  var c = readCount(); c.done++; if (king) c.king++; saveCount(c); renderCount();
  $('#score').textContent = S.score;
  $('#king').hidden = !king;
  $('#ticketMsg').textContent = king
    ? '도우미에게 이 화면을 보여 주고, 간식 + 경제왕 스탬프를 받아요!'
    : '도우미에게 이 화면을 보여 주고 간식을 받아요. 손등 스탬프도 꾹!';
  var d = new Date();
  $('#stampTime').textContent = '완주 시각 ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  show('s-result');
  clearTimeout(timer); clearInterval(tick);
  var left = RESULT_MS / 1000;
  $('#autoMsg').textContent = left + '초 뒤 처음 화면으로 돌아가요';
  tick = setInterval(function () {
    left--;
    $('#autoMsg').textContent = left + '초 뒤 처음 화면으로 돌아가요';
    if (left <= 0) goStart();
  }, 1000);
}

$('#startBtn').onclick = start;
$('#nextBtn').onclick = next;
$('#doneBtn').onclick = goStart;
// 태블릿에서 실수로 뒤로 가기·새로 고침을 막아요 (퀴즈 중일 때만 확인)
window.addEventListener('beforeunload', function (e) { if (!$('#s-quiz').hidden) { e.preventDefault(); e.returnValue = ''; } });
renderCount();
</script>
